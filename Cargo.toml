[package]
name = "axum-error-sets"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
keywords = ["axum", "error-handling", "type-sets", "openapi", "aide"]
categories = ["web-programming::http-server", "rust-patterns"]
description = "Typed, composable HTTP error sets for Axum and Aide"
homepage = "https://github.com/jvdwrf/axum-error-sets"
repository = "https://github.com/jvdwrf/axum-error-sets"
readme = "README.md"

[dependencies]
axum-core = "0.5"
type-sets = "^0.1.1"
http = "1"
aide = { version = "0.15", optional = true }
utoipa = { version = "5", optional = true }

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-typed-routing = { version = "0.4", features = ["aide"] }
rootcause = "0.13"
axum-error-sets = { path = ".", features = ["aide", "utoipa"] }
serde = { version = "1.0", features = ["derive"] }
schemars = "0.9"
aide = { version = "0.15", features = [
    "axum-query",
    "axum-json",
    "axum-tokio",
    "axum-form",
    "macros",
] }
utoipa = { version = "5", features = ["axum_extras"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"

[features]
default = []
aide = ["dep:aide"]
utoipa = ["dep:utoipa"]
_ra = ["aide", "utoipa"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
